name: MIT 6.006 PS6 programming
on:
  push:
    branches: [edidada/ps6-programming]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: ps6
        run: python -m unittest -v tests test_oracle
